<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 1 - Simple Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
            margin: 0;
            padding: 20px;
        }
        .calculator {
            max-width: 320px;
            margin: 60px auto;
            padding: 25px;
            background-color: white;
            border: 1px solid #cccccc;
            border-radius: 8px;
            box-shadow: 0 4px 12px #00000015;
        }
        h1, h2 { text-align: center; }
        h1 { font-size: 24px; }
        h2 { font-size: 18px; color: #555555; }
        label { display: block; margin-top: 15px; }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #999999;
            border-radius: 4px;
            font-size: 16px;
        }
        .buttons { display: flex; gap: 8px; margin-top: 20px; }
        button {
            flex: 1;
            padding: 10px;
            font-size: 18px;
            cursor: pointer;
            background-color: #2563a6;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover { background-color: #174779; }
        .clear { width: 100%; background-color: #666666; font-size: 16px; }
        #result { padding: 12px; background-color: #eeeeee; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <main class="calculator">
        <h1>Simple Calculator</h1>
        <h2>Full Stack Lab - Lab 1</h2>
        <label for="number1">First number</label>
        <input type="number" id="number1" step="any" placeholder="Enter first number">
        <label for="number2">Second number</label>
        <input type="number" id="number2" step="any" placeholder="Enter second number">
        <div class="buttons">
            <button type="button" onclick="calculate('+')" aria-label="Add">+</button>
            <button type="button" onclick="calculate('-')" aria-label="Subtract">-</button>
            <button type="button" onclick="calculate('*')" aria-label="Multiply">×</button>
            <button type="button" onclick="calculate('/')" aria-label="Divide">÷</button>
        </div>
        <p id="result" role="status">Result: </p>
        <button type="button" class="clear" onclick="clearCalculator()">Clear</button>
    </main>
    <script>
        // Get both numbers and perform the selected operation.
        function calculate(operator) {
            var first = document.getElementById('number1').value;
            var second = document.getElementById('number2').value;
            var output = document.getElementById('result');
            if (first === '' || second === '') {
                output.textContent = 'Please enter both numbers.';
                return;
            }
            var a = Number(first);
            var b = Number(second);
            var answer;
            if (!Number.isFinite(a) || !Number.isFinite(b)) {
                output.textContent = 'Please enter valid numbers.';
                return;
            }
            if (operator === '+') {
                answer = a + b;
            } else if (operator === '-') {
                answer = a - b;
            } else if (operator === '*') {
                answer = a * b;
            } else if (operator === '/') {
                if (b === 0) {
                    output.textContent = 'Cannot divide by zero.';
                    return;
                }
                answer = a / b;
            }
            if (!Number.isFinite(answer)) {
                output.textContent = 'Result is too large. Try smaller numbers.';
                return;
            }
            output.textContent = 'Result: ' + Number(answer.toPrecision(12));
        }
        function clearCalculator() {
            document.getElementById('number1').value = '';
            document.getElementById('number2').value = '';
            document.getElementById('result').textContent = 'Result: ';
            document.getElementById('number1').focus();
        }
    </script>
</body>
</html>
